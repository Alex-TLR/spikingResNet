# Configuration for Population Test Mode
# Tests with different extraction time steps

# Dataset Parameters
dataset:
  id: 'CIFAR10'
  features: ['CIFAR10', 'CIFAR100', 'tImage200']

# Model Parameters
model:
  type: 'spike'
  resnet_model: 18
  num_classes: 10
  expansion: 1
  num_time_steps_train: 4
  num_time_steps_extract: 4
  seed: 42

# Training Parameters
training:
  batch_size: 64
  full_train: true
  auto_aug: true
  pretrained: false
  epochs: 400
  loss: 'count_loss'
  fit: 'spike'

# Test Mode and Type
mode: 'test'
test_type: 'population'

# Device and Parallel Processing
device: 'cuda'
num_workers: 4

# Optimizer Parameters
optimizer:
  name: 'adam'
  learning_rate: 2.0e-4
  momentum: 0.9
  weight_decay: 1.0e-4

# Learning Rate Scheduler
scheduler:
  name: 'cosine'
  step_size: null

# Gradient Clipping
gradient_clipping: 0.1

# Experiment Parameters
experiment:
  case: '42'
  methods: ['NCM', 'KNN']  # OOD detection methods
  seeds: null
  expansions: null
  resnet_models: null
  override_feature_extraction: true
  near_ood: null
  far_ood: null
