# Base configuration for comparing SNN training losses on CIFAR-100.
# The CLI selects historical losses and optional explicit CE variants.

dataset:
  id: 'CIFAR100'
  features: ['CIFAR100']

model:
  type: 'spike'
  resnet_model: 18
  num_classes: 100
  expansion: 1
  num_time_steps_train: 4
  num_time_steps_extract: 4
  pooling: 'avg'
  readout: 'linear'
  seed: 42

training:
  batch_size: 128
  full_train: true
  auto_aug: true
  pretrained: false
  epochs: 300
  loss: 'cross_entropy'
  # Controls the backpropagation path and input normalization.
  # 'membrane' uses CIFAR statistics; 'spike' preserves inputs in [0, 1].
  fit: 'membrane'
  ce_source: 'logits'
  ce_mode: 'temporal_mean'
  population_reduction: 'mean'

optimizer:
  name: 'sgd'
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4

scheduler:
  name: 'cosine'
  step_size: null

gradient_clipping: 1.0
device: 'cuda'
num_workers: 4
mode: 'train'

experiment:
  case: 'loss_accuracy_cifar100_v1'
  seeds: [42]
  expansions: [1]
  resnet_models: [18]
