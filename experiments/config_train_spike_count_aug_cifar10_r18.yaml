# Configuration for Multi-Train Experiment Mode
# Base parameters define defaults; experiment section specifies sweep parameters

# Dataset Parameters
dataset:
  id: 'CIFAR10'
  features: ['CIFAR10', 'CIFAR100', 'tImage200']

# Model Parameters (Base Configuration)
# These are used for single runs or as defaults before experiment sweeps
model:
  type: 'spike'  # Options: 'spike' or 'conv'
  num_classes: 10
  num_time_steps_train: 1
  num_time_steps_extract: 1

# Training Parameters (Base Configuration)
training:
  batch_size: 64
  full_train: true
  auto_aug: true
  pretrained: false
  epochs: 400  # Set to 400 if auto_aug is True, otherwise 200
  loss: 'count_loss'  # Options: 'count_loss', 'cross_entropy', 'mse_count_loss'
  fit: 'spike'

# Optimizer Parameters
optimizer:
  name: 'adam'
  learning_rate: 2.0e-4
  momentum: 0.9
  weight_decay: 1.0e-4

# Learning Rate Scheduler
scheduler:
  name: 'cosine'
  step_size: null

# Gradient Clipping
gradient_clipping: 0.1

# Device and Parallel Processing
device: 'cuda'
num_workers: 4

# Options: 'test', 'test_population', 'test_1', 'train', 'multi_test', 'ex_1', 'ex_2'
mode: 'train'

# Experiment Sweep Parameters
# These define arrays of values to iterate over during train experiments
# Each combination of (seed × expansion × resnet_model) will be trained
experiment:
  case: '42'
  methods: null
  # Random seeds for multiple training runs (for statistical significance)
  seeds: [42, 1987, 1991, 2020, 2024]
  
  # Expansion factors to evaluate (1 = standard, >1 = population coding)
  expansions: [1, 5, 10, 25, 50]
  
  # ResNet architectures to train (ResNet-4, ResNet-10, ResNet-18)
  resnet_models: [18]
  
  # Override feature extraction behavior (used in test_population, test_1, ex_1, ex_2 modes)
  override_feature_extraction: false
  
  # OOD detection methods (used in ex_1, ex_2 modes only)
  # near_ood: ['CIFAR10', 'CIFAR100', 'tImage200']
  # far_ood: ['CIFAR10', 'MNIST', 'SVHN', 'Textures', 'Places365']
