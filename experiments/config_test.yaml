# Simple Configuration for Single Training/Testing Run
# This is an alias for config_test_standard.yaml

# Dataset Parameters
dataset:
  id: 'CIFAR10'
  features: ['CIFAR10', 'CIFAR100', 'tImage200']

# Model Parameters
model:
  type: 'spike'
  resnet_model: 18
  num_classes: 10
  expansion: 1
  num_time_steps_train: 1
  num_time_steps_extract: 1
  seed: 42

# Training Parameters
training:
  batch_size: 64
  full_train: true
  auto_aug: true
  pretrained: false
  epochs: 400
  loss: 'count_loss'
  fit: 'spike'

# Pipeline Mode: standard test (train, test, extract features, compute statistics)
mode: 'test'
test_type: 'accuracy'

# Device and Parallel Processing
device: 'cuda'
num_workers: 4

# Optimizer Parameters
optimizer:
  name: 'adam'
  learning_rate: 2.0e-4
  momentum: 0.9
  weight_decay: 1.0e-4

# Learning Rate Scheduler
scheduler:
  name: 'cosine'
  step_size: null

# Gradient Clipping
gradient_clipping: 0.1

# No experiment sweeps for single run mode
experiment:
  case: '42'
  methods: null
  seeds: null
  expansions: null
  resnet_models: [4, 10, 18]
  override_feature_extraction: false
  near_ood: null
  far_ood: null
  # Random seeds for multiple training runs (for statistical significance)
  seeds: [42, 1987, 1991, 2020, 2024]
  
  # Expansion factors to evaluate (1 = standard, >1 = population coding)
  expansions: [1, 5, 10, 25, 50]
